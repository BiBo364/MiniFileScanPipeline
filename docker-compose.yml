services:
  postgres:
    image: postgres:16-alpine
    container_name: mini-scan-postgres
    environment:
      POSTGRES_USER: scans
      POSTGRES_PASSWORD: scans
      POSTGRES_DB: scans
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U scans -d scans']
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: mini-scan-rabbitmq
    ports:
      - '5672:5672'
      - '15672:15672'
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', '-q', 'ping']
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
